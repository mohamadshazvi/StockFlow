spring:
  application:
    name: stockflow
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${DB_USERNAME:stockflow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: logstash

app:
  currency: ${APP_CURRENCY:LKR}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:stockflow}
    audience: ${JWT_AUDIENCE:stockflow-web}
  cors:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
